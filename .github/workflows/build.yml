name: Build IN_C1_Scale

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build IN_C1_Scale.csproj -c Release -o out

      - name: List output files
        shell: pwsh
        run: Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: IN_C1_Scale
          path: out/IN_C1_Scale.exe

      - name: Attach the EXE to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/IN_C1_Scale.exe
          generate_release_notes: true
